title: Criminal Justice Information Services (CJIS) Security Policy
metadata:
  id: rhel8-cjis-policy
  type: Policy
  gemara-version: 1.2.0
  description: Automated evaluation policy for the 'cjis' profile on Red Hat Enterprise Linux 8, generated from the resolved ComplianceAsCode profile. requirement-id values are short CaC rule names (the OpenSCAP provider adds the xccdf_org.ssgproject.content_rule_ prefix).
  author:
    id: complianceascode
    name: ComplianceAsCode Project
    type: Software
    uri: https://github.com/ComplianceAsCode/content
  date: '2026-11-12T18:17:36Z'
  mapping-references:
    - id: rhel8-rules
      title: RHEL8 Rules Control Catalog for RHEL8
      version: ''
      url: file://../catalogs/rhel8-rules-catalog.yaml
contacts:
  responsible:
    - name: System Administrator
  accountable:
    - name: Security Team
scope:
  in:
    technologies:
      - Red Hat Enterprise Linux 8
imports:
  catalogs:
    - reference-id: rhel8-rules
