title: PCI-DSS v3.2.1 Control Baseline for Fedora
metadata:
  id: fedora-pci-dss-policy
  type: Policy
  gemara-version: 1.2.0
  description: Automated evaluation policy for the 'pci-dss' profile on Fedora, generated from the resolved ComplianceAsCode profile. requirement-id values are short CaC rule names (the OpenSCAP provider adds the xccdf_org.ssgproject.content_rule_ prefix).
  author:
    id: complianceascode
    name: ComplianceAsCode Project
    type: Software
    uri: https://github.com/ComplianceAsCode/content
  date: '2026-11-12T18:17:49Z'
  mapping-references:
    - id: fedora-rules
      title: Fedora Rules Control Catalog for Fedora
      version: ''
      url: file://../catalogs/fedora-rules-catalog.yaml
contacts:
  responsible:
    - name: System Administrator
  accountable:
    - name: Security Team
scope:
  in:
    technologies:
      - Fedora
imports:
  catalogs:
    - reference-id: fedora-rules
adherence:
